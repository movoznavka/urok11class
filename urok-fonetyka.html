<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фонетика · Урок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#D0E9FC;
    --bg-soft:#E4F2FC;
    --card:#FFFFFF;
    --ink:#13213B;
    --ink-soft:#6478A0;
    --line: rgba(19,33,59,0.08);

    --c1-a:#6C8CFF; --c1-b:#3355EE; --c1-sh: rgba(51,85,238,0.45);
    --c3-a:#5FE0A8; --c3-b:#17A863; --c3-sh: rgba(23,168,99,0.4);
    --c2-b:#E5484D;
    --c4-a:#FFB86C; --c4-b:#F5820D;

    --correct-bg:#E6F8EE;
    --correct-ink:#128A54;
    --wrong-bg:#FDECEC;
    --wrong-ink:#D8393E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 64px;
    position:relative;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:16px;margin-bottom:22px;
    border-bottom:1.5px solid rgba(19,33,59,0.14);
  }
  .kicker{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.55;
  }
  .kicker.tag{opacity:.4;}

  h1{
    font-family:'Manrope',sans-serif;font-weight:800;
    font-size:clamp(24px,5.6vw,36px);line-height:1.08;letter-spacing:-0.01em;
    margin:0 0 8px;text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}
  .sub{color:var(--ink-soft);font-size:15px;max-width:56ch;margin:0 0 22px;font-weight:500;}

  /* level 1: Голосні / Приголосні */
  .topictoggle{display:flex;gap:10px;margin-bottom:14px;}
  .topictoggle button{
    flex:1;padding:15px;border-radius:20px;border:none;background:var(--card);
    font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;color:var(--ink-soft);
    cursor:pointer;box-shadow:0 8px 18px -14px rgba(19,33,59,.3);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .topictoggle button.active{
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;
    box-shadow:0 10px 20px -10px var(--c1-sh);
  }

  /* level 2 & level 3 tabs */
  .tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .tabbar.nested{margin-bottom:20px;}
  .tab{
    padding:10px 15px 10px 10px;border-radius:999px;border:none;background:var(--card);
    color:var(--ink-soft);font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;
    cursor:pointer;display:flex;align-items:center;gap:8px;
    box-shadow: 0 8px 18px -14px rgba(19,33,59,0.3);
  }
  .tabbar.nested .tab{background:var(--bg-soft);box-shadow:none;}
  .tab .dot{
    width:22px;height:22px;border-radius:8px;background:rgba(51,85,238,.1);color:var(--c1-b);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  }
  .tab.active{
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;
    box-shadow:0 10px 20px -10px var(--c1-sh);
  }
  .tab.active .dot{background:rgba(255,255,255,.25);color:#fff;}

  .tabbar.nested .tab.active{background:#fff;color:var(--c1-b);box-shadow:0 6px 16px -10px rgba(19,33,59,.3);}
  .tabbar.nested .tab.active .dot{background:var(--c1-b);color:#fff;}

  .card{
    background:var(--card);border-radius:28px;padding:28px 24px;
    box-shadow: 0 20px 44px -28px rgba(19,33,59,0.35);
  }

  .section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.005em;margin:0 0 8px;}
  .section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px;}
  .section-intro b{color:var(--ink);}

  .callout{
    background:linear-gradient(155deg, rgba(255,184,108,.22), rgba(245,130,13,.10));
    border-radius:18px;padding:14px 18px;margin-bottom:20px;font-size:13.5px;line-height:1.55;color:var(--ink);
  }
  .callout b{color:var(--c4-b);font-family:'Manrope',sans-serif;}

  .mnemo{margin-top:16px;font-size:13px;line-height:1.55;color:var(--ink-soft);}
  .mnemo b{color:var(--ink);}

  /* flip cards */
  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.cardgrid{grid-template-columns:1fr;}}
  .flip{perspective:1200px;height:158px;cursor:pointer;position:relative;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .flip.open .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;border-radius:20px;padding:16px 18px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;}
  .flip-front{background:var(--bg-soft);}
  .flip-back{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;transform:rotateY(180deg);align-items:center;text-align:center;}
  .flip-tag{font-family:'Manrope',sans-serif;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin-bottom:7px;}
  .flip-back .flip-tag{opacity:.75;}
  .flip-rule{font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;line-height:1.32;}
  .flip-desc{font-size:12.5px;margin-top:7px;opacity:.8;line-height:1.4;}
  .flip-example{font-size:14px;font-weight:700;margin-bottom:3px;}
  .flip-example:last-child{margin-bottom:0;}
  .flip-note{font-size:11px;opacity:.7;font-weight:500;}
  .flip-hint{position:absolute;bottom:9px;right:14px;font-size:10px;font-weight:700;opacity:.4;}

  /* exceptions chips */
  .chiprow{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{background:var(--bg-soft);border-radius:16px;padding:13px 18px;cursor:pointer;min-width:126px;transition:background .2s;}
  .chip .w{font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;}
  .chip .ipa{font-size:12.5px;color:#fff;font-weight:700;margin-top:5px;display:none;}
  .chip.open{background:linear-gradient(155deg, var(--c4-a), var(--c4-b));}
  .chip.open .w{color:#fff;}
  .chip.open .ipa{display:block;}

  /* combo table */
  .combo-table{display:flex;flex-direction:column;gap:8px;}
  .combo-row{display:flex;align-items:center;gap:12px;background:var(--bg-soft);border-radius:16px;padding:12px 16px;cursor:pointer;flex-wrap:wrap;}
  .combo-write{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;color:var(--c1-b);min-width:56px;}
  .combo-say{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--ink-soft);min-width:52px;}
  .combo-example{flex:1;font-size:14px;font-weight:600;min-width:110px;}
  .combo-ipa{font-size:13px;font-weight:700;color:var(--c3-b);opacity:0;transition:opacity .2s;}
  .combo-row.open .combo-ipa{opacity:1;}

  /* mini quiz */
  .qtext{font-family:'Manrope',sans-serif;font-size:18px;font-weight:700;line-height:1.4;margin:0 0 18px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:center;gap:13px;text-align:left;width:100%;
    padding:9px 14px 9px 9px;border-radius:18px;border:none;background:var(--bg-soft);
    cursor:pointer;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:500;color:var(--ink);
    transition:transform .12s ease, background .15s ease;
  }
  .opt:hover{transform:translateY(-1px);}
  .opt[disabled]{cursor:default;}
  .opt[disabled]:hover{transform:none;}
  .tile{
    position:relative;width:30px;height:30px;min-width:30px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--c1-b);
    background: linear-gradient(150deg, rgba(255,255,255,0.75), rgba(108,140,255,0.22));
    backdrop-filter: blur(6px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 12px -7px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.8);
  }
  .badge{
    position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
    border:2px solid var(--card);display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:800;color:#fff;
  }
  .badge.ok{background:var(--c3-b);}
  .badge.no{background:var(--c2-b);}
  .opt.correct{background:var(--correct-bg);}
  .opt.wrong{background:var(--wrong-bg);}
  .opt.dim{opacity:.5;}
  .feedback{margin-top:16px;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;display:none;align-items:center;gap:9px;}
  .feedback.show{display:flex;}
  .feedback.ok{background:var(--correct-bg);color:var(--correct-ink);}
  .feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink);}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .btn{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;padding:12px 22px;
    border-radius:999px;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .btn.primary{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -8px var(--c1-sh);}
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn:disabled{opacity:.3;cursor:default;box-shadow:none;}
  .qprog{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}

  .done-screen{text-align:center;padding:16px 0;}
  .done-screen .ring{
    width:110px;height:110px;margin:0 auto 16px;border-radius:50%;
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));
    box-shadow:0 16px 30px -12px var(--c1-sh);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .done-screen .big{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff;}

  footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}

  /* ===================== DRAWING / TEACHER MODE ===================== */
  /* Canvas is positioned over the whole DOCUMENT (not just the viewport),
     so ink scrolls together with the page content instead of staying
     glued to the screen. Its size is recalculated after every content
     change (see resizeCanvas() below). */
  #drawCanvas{
    position:absolute;
    top:0;
    left:0;
    z-index:9998;
    pointer-events:none; /* drawing is handled via window-level listeners so
                             taps/clicks on real UI underneath always pass through */
  }

  #drawToggleBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;height:58px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.5);
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,var(--c1-a),var(--c1-b));
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    box-shadow:
      0 14px 28px -10px var(--c1-sh),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:9999;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease;
  }
  #drawToggleBtn svg{
    width:24px;height:24px;
    display:block;
    transition:transform .25s ease, opacity .15s ease;
  }
  #drawToggleBtn:active{transform:scale(0.90);}
  #drawToggleBtn.on{
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,#FF8A65,var(--c2-b));
    box-shadow:
      0 14px 28px -10px rgba(229,72,77,0.55),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
  }
  #drawToggleBtn.on svg{ transform:rotate(90deg); }

  #drawToolbar{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(130%) scale(0.94);
    opacity:0;
    display:flex;
    align-items:center;
    gap:12px;
    background:
      linear-gradient(150deg, rgba(255,255,255,0.6), rgba(255,255,255,0.15));
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.7);
    padding:9px 16px;
    border-radius:999px;
    box-shadow:
      0 24px 48px -20px rgba(19,33,59,0.45),
      inset 0 1px 1px rgba(255,255,255,0.9);
    z-index:9999;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    pointer-events:none;
  }
  #drawToolbar.show{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
  }
  /* панель згорнута, але малювання лишається увімкненим */
  #drawToolbar.mini{
    transform:translateX(-50%) translateY(130%) scale(0.94);
    opacity:0;
    pointer-events:none;
  }
  #drawToolbarMini{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(130%) scale(0.9);
    opacity:0;
    width:40px;height:26px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.5);
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));
    box-shadow:0 10px 20px -10px var(--c1-sh);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:9999;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    pointer-events:none;
  }
  #drawToolbarMini svg{width:18px;height:18px;}
  #drawToolbarMini.show{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
  }
  .swatch{
    position:relative;
    width:25px;height:25px;
    border-radius:50%;
    border:none;
    box-shadow:
      0 3px 8px -2px rgba(19,33,59,0.35),
      inset 0 1px 1px rgba(255,255,255,0.5);
    cursor:pointer;
    padding:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch::after{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:2px solid var(--ink);
    opacity:0;
    transform:scale(0.7);
    transition:opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch.selected{ transform:scale(1.08); }
  .swatch.selected::after{ opacity:1; transform:scale(1); }
  .tool-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.5);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .tool-btn svg{ width:16px; height:16px; }
  .tool-btn .dot{
    border-radius:50%;
    background:currentColor;
  }
  #xthinBtn .dot{ width:3.5px; height:3.5px; }
  #thinBtn .dot{ width:7px; height:7px; }
  #thickBtn .dot{ width:12.5px; height:12.5px; }
  .tool-btn.selected{
    background:var(--c1-b);
    color:#fff;
    transform:scale(1.06);
  }
  .tool-sep{
    width:1px;
    height:22px;
    background:rgba(19,33,59,0.14);
  }

  @media (max-width:480px){
    #drawToolbar{
      max-width:94vw;
      overflow-x:auto;
      padding:8px 13px;
      gap:9px;
    }
    .swatch{width:21px;height:21px;}
    .tool-btn{width:30px;height:30px;}
    .tool-btn svg{width:14px;height:14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="kicker">Фонетика · Урок</div>
    <div class="kicker tag" id="totalTag"></div>
  </div>

  <h1>Звуки і <span class="hl">букви</span></h1>

  <div class="topictoggle" id="topictoggle"></div>
  <div class="tabbar" id="subtabbar"></div>
  <div class="tabbar nested" id="subsubtabbar"></div>

  <div class="card" id="lessonArea"></div>

  <footer>@movoznavka</footer>
</div>

<!-- ==== Малювання поверх екрана (для вчителя) ==== -->
<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати">
  <svg id="drawIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#F5304A" data-color="#F5304A"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#13213B" data-color="#13213B"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="xthinBtn" title="Дуже тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="tool-btn" id="clearBtn" title="Очистити все">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="minimizeBtn" title="Згорнути панель">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
<button id="drawToolbarMini" title="Розгорнути панель">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 15L12 9L18 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<script>
/* ============================================================
   ЯК ДОДАТИ ЧИ ЗМІНИТИ МАТЕРІАЛ
   Весь контент живе в об'єкті TOPICS нижче.
   Структура: TOPICS.voice / TOPICS.consonant → subs [ ... ] →
   (якщо є) subsubs [ ... ]. Кожен розділ — один об'єкт { ... }.
   Щоб додати картку/слово/рядок/питання — скопіюй існуючий блок
   { ... } всередині потрібного масиву (cards / words / rows /
   questions), встав кому після нього і зміни текст між лапками.
   Щоб додати цілий новий підрозділ (нову кнопку-вкладку) —

   з фігурними дужками, і зміни в ньому tab / title / вміст.
   Нічого більше в коді чіпати не треба.
   ============================================================ */

const LETTERS = ["А","Б","В","Г"];
const TOPIC_ORDER = ["voice","consonant","other"];

let activeTopic = "voice";
let activeSub = 0;
let activeSubsub = 0;
let quizIdx = 0;
let quizAnswers = {};

const topictoggle = document.getElementById('topictoggle');
const subtabbar = document.getElementById('subtabbar');
const subsubtabbar = document.getElementById('subsubtabbar');
const lessonArea = document.getElementById('lessonArea');

function resetNav(){ activeSub = 0; activeSubsub = 0; quizIdx = 0; quizAnswers = {}; }
function resetQuiz(){ quizIdx = 0; quizAnswers = {}; }

function currentSub(){ return TOPICS[activeTopic].subs[activeSub]; }
function currentSection(){
  const sub = currentSub();
  if(sub.type === "nested") return sub.subsubs[activeSubsub];
  return sub;
}

// ---- per-tab drawing storage: намальоване на кожній вкладці (і на кожному
// питанні тесту) зберігається окремо, тож перехід на іншу вкладку й назад
// не стирає написане, а показує саме те, що було на ній ----
const drawStore = {};
function sectionKey(){
  const sec = currentSection();
  let k = activeTopic + '__' + activeSub + '__' + activeSubsub;
  if(sec.type === "quiz") k += '__q' + quizIdx;
  return k;
}
function saveCurrentDrawing(){
  if(window.getDrawingSnapshot) drawStore[sectionKey()] = window.getDrawingSnapshot();
}
function restoreCurrentDrawing(){
  if(window.setDrawingSnapshot) window.setDrawingSnapshot(drawStore[sectionKey()] || null);
}

function renderTopics(){
  topictoggle.innerHTML = TOPIC_ORDER.map(key => `
    <button class="${key===activeTopic?'active':''}" data-key="${key}">${TOPICS[key].label}</button>
  `).join('');
  topictoggle.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      saveCurrentDrawing();
      activeTopic = btn.dataset.key;
      resetNav();
      renderAll();
    };
  });
}

function renderSubs(){
  const subs = TOPICS[activeTopic].subs;
  subtabbar.innerHTML = subs.map((s,i)=>`
    <button class="tab ${i===activeSub?'active':''}" data-i="${i}">
      <span class="dot">${s.dot}</span>${s.tab}
    </button>`).join('');
  subtabbar.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick = ()=>{
      saveCurrentDrawing();
      activeSub = +btn.dataset.i;
      activeSubsub = 0;
      resetQuiz();
      renderAll();
    };
  });
}

function renderSubSubs(){
  const sub = currentSub();
  if(sub.type !== "nested"){ subsubtabbar.innerHTML = ""; subsubtabbar.style.display = "none"; return; }
  subsubtabbar.style.display = "flex";
  subsubtabbar.innerHTML = sub.subsubs.map((s,i)=>`
    <button class="tab ${i===activeSubsub?'active':''}" data-i="${i}">
      <span class="dot">${s.dot}</span>${s.tab}
    </button>`).join('');
  subsubtabbar.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick = ()=>{
      saveCurrentDrawing();
      activeSubsub = +btn.dataset.i;
      resetQuiz();
      renderSubSubs();
      renderContent();
    };
  });
}

function renderContent(){
  const s = currentSection();
  let html = `<p class="section-title">${s.title}</p><p class="section-intro">${s.intro}</p>`;
  if(s.type === "cards"){
    html += `<div class="cardgrid">${s.cards.map((c)=>`
      <div class="flip" data-kind="card">        <div class="flip-inner">
          <div class="flip-face flip-front">
            <div class="flip-rule">${c.rule}</div>
            <div class="flip-desc">${c.desc||''}</div>
            <div class="flip-hint">натисни →</div>
          </div>
          <div class="flip-face flip-back">
            ${c.examples.map(e=>`<div class="flip-example">${e.word}${e.ipa?' '+e.ipa:''}</div>${e.note?`<div class="flip-note">${e.note}</div>`:''}`).join('')}
          </div>
        </div>
      </div>`).join('')}</div>`;
    if(s.mnemo) html += `<div class="mnemo">${s.mnemo}</div>`;
  }

  if(s.type === "exceptions"){
    html += `<div class="chiprow">${s.words.map((w)=>`
      <div class="chip" data-kind="chip">
        <div class="w">${w.word}</div>
        <div class="ipa">${w.ipa}</div>
      </div>`).join('')}</div>`;
  }

  if(s.type === "table"){
    html += `<div class="combo-table">${s.rows.map((r)=>`
      <div class="combo-row" data-kind="row">
        <span class="combo-write">${r.write}</span>
        <span class="combo-say">${r.say}</span>
        <span class="combo-example">${r.example}</span>
        <span class="combo-ipa">${r.ipa}</span>
      </div>`).join('')}</div>`;
  }

  if(s.type === "quiz"){
    lessonArea.innerHTML = html;
    renderQuiz(s);
    syncCanvasAfterRender();
    return;
  }

  lessonArea.innerHTML = html;
  lessonArea.querySelectorAll('[data-kind="card"], [data-kind="chip"], [data-kind="row"]').forEach(el=>{
    const toggle = ()=>{ el.classList.toggle('open'); };
    if(window.attachTapToggle) window.attachTapToggle(el, toggle); else el.onclick = toggle;
  });
  syncCanvasAfterRender();
}

function syncCanvasAfterRender(){
  // дає верстці "осісти", а тоді підганяє розмір канвасу малювання під нову висоту сторінки,
  // і відновлює те, що було намальоване саме на цій вкладці (якщо було)
  if(window.resizeDrawCanvas){
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      window.resizeDrawCanvas();
      restoreCurrentDrawing();
    }));
  }
}

function quizScore(qs){
  let correct = 0, answered = 0;
  qs.forEach((_,i)=>{ const r = quizAnswers[i]; if(r){ answered++; if(r.correct) correct++; } });
  return {correct, answered, total: qs.length};
}

function renderQuiz(s){
  const total = s.questions.length;

  if(quizIdx >= total){
    const {correct} = quizScore(s.questions);
    const extra = document.createElement('div');
    extra.innerHTML = `
      <div class="done-screen">
        <div class="ring"><div class="big">${correct}/${total}</div></div>
        <p class="section-intro" style="margin-top:10px;">${correct===total ? 'Ідеально! Матеріал засвоєно 🎉' : 'Непогано — можна ще раз пробігтись картками вище.'}</p>
        <button class="btn primary" id="quizRestart" style="margin-top:6px;">Пройти ще раз</button>
      </div>`;
    lessonArea.appendChild(extra);
    document.getElementById('quizRestart').onclick = ()=>{ resetQuiz(); renderContent(); };
    return;
  }

  const q = s.questions[quizIdx];
  const rec = quizAnswers[quizIdx];

  const box = document.createElement('div');
  box.innerHTML = `
    <div class="qprog">Питання ${quizIdx+1} з ${total}</div>
    <p class="qtext">${q.q}</p>
    <div class="options">
      ${q.opts.map((o,i)=>`
        <button class="opt" data-i="${i}" ${rec?'disabled':''}>
          <span class="tile"><span>${LETTERS[i]}</span></span><span>${o}</span>
        </button>`).join('')}
    </div>
    <div class="feedback ${rec?'show '+(rec.correct?'ok':'bad'):''}">
      ${rec ? (rec.correct ? `<span><b>Правильно.</b></span>` : `<span>Правильна відповідь — ${LETTERS[q.a]}. ${q.opts[q.a]}</span>`) : ''}
    </div>
    <div class="nav-row">
      <button class="btn ghost" id="quizPrev" ${quizIdx===0?'disabled':''}>← Назад</button>
      <button class="btn primary" id="quizNext" ${rec?'':'disabled'}>${quizIdx===total-1?'До результату':'Далі →'}</button>
    </div>`;
  lessonArea.appendChild(box);

  if(rec){
    box.querySelectorAll('.opt').forEach((btn,i)=>{
      const tile = btn.querySelector('.tile');
      if(i===q.a){ btn.classList.add('correct'); tile.insertAdjacentHTML('beforeend','<span class="badge ok">✓</span>'); }
      else if(i===rec.picked){ btn.classList.add('wrong'); tile.insertAdjacentHTML('beforeend','<span class="badge no">✕</span>'); }
      else { btn.classList.add('dim'); }
    });
  }

  box.querySelectorAll('.opt').forEach(btn=>{
    const toggle = ()=>{
      if(quizAnswers[quizIdx]) return;
      const picked = +btn.dataset.i;
      quizAnswers[quizIdx] = {picked, correct: picked===q.a};
      renderContent();
    };
    if(window.attachTapToggle) window.attachTapToggle(btn, toggle); else btn.onclick = toggle;
  });
  const prevBtn = document.getElementById('quizPrev');
  const nextBtn = document.getElementById('quizNext');
  if(prevBtn) prevBtn.onclick = ()=>{ saveCurrentDrawing(); quizIdx--; renderContent(); };
  if(nextBtn) nextBtn.onclick = ()=>{ saveCurrentDrawing(); quizIdx++; renderContent(); };
}

// ---- надійне розпізнавання "тапу", яке не залежить від click-події
// (Safari може відкласти click після дотику, а поки триває малювання пером,
// клацання по інтерфейсу взагалі не потрібні) — визначено тут, ЩЕ ДО
// першого renderAll(), щоб картки з першого ж рендеру одразу
// використовували цю логіку, а не тимчасовий запасний onclick ----
function attachTapToggle(el, handler){
  let sx = 0, sy = 0, penTap = false, tracking = false;
  el.addEventListener('pointerdown', (e)=>{
    tracking = true;
    sx = e.clientX; sy = e.clientY;
    penTap = e.pointerType === 'pen';
  }, {passive:true});
  el.addEventListener('pointerup', (e)=>{
    if(!tracking) return;
    tracking = false;
    if(penTap && window.isDrawingActive && window.isDrawingActive()) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.hypot(dx,dy) > 10) return;
    handler(e);
  });
}
window.attachTapToggle = attachTapToggle;

function renderAll(){
  renderTopics();
  renderSubs();
  renderSubSubs();
  renderContent();
}

renderAll();

//
// Ця версія навмисно ПРОСТІША за попередню. Кожне попереднє "покращення"
// (окреме чорнило на кожному боці картки, компенсація масштабу для кнопки
// й панелі, гасіння кліку через таймер) додавало власний клас багів:
// панель "губилася" при зумі, кнопка "тікала" не в той кут, картки й далі
// перевертались, бо 300мс затримка кліку в Safari іноді довша за наш
// таймер. Тому тут:
//   • ОДНЕ спільне полотно на всю сторінку (в т.ч. поверх карток) —
//     менше рухомих частин, менше місць для помилки;
//   • перевертання картки більше НЕ залежить від того, чи встигне
//     браузер сам згенерувати/скасувати клік — ми самі відстежуємо
//     послідовність "дотик пальцем без зсуву" через pointerdown/pointerup
//     і повністю ігноруємо перо, поки ввімкнено малювання;
//   • кнопка й панель кольорів — звичайний CSS position:fixed, без жодного
//     JS-перерахунку позиції під час зуму. Це означає, що під час
//     збільшення вони поводяться як практично будь-який інший сайт (можуть
//     трохи змінювати видиме положення разом зі сторінкою), але НІКОЛИ не
//     зникають і не "тікають" — а це важливіше.
// ======================================================================
(function(){
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('drawToggleBtn');
  const toolbar = document.getElementById('drawToolbar');
  const toolbarMini = document.getElementById('drawToolbarMini');
  const minimizeBtn = document.getElementById('minimizeBtn');
  const xthinBtn = document.getElementById('xthinBtn');
  const thinBtn = document.getElementById('thinBtn');
  const thickBtn = document.getElementById('thickBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const swatches = document.querySelectorAll('.swatch');

  let drawingActive = false;
  let isDrawing = false;
  let currentColor = "#F5304A";
  let currentWidth = 2;      // за замовчуванням — тонкий
  let eraserMode = false;
  let lastX = 0, lastY = 0;
  let strokeMoved = false;
  let currentStroke = null;
  const ERASE_RADIUS = 20;  // px — наскільки близько треба торкнутись штриха, щоб стерти його цілком

  window.isDrawingActive = function(){ return drawingActive; };

  // ---- штрихи поточної вкладки (векторні, не пікселі — це дозволяє
  // ластику видаляти цілий штрих одним дотиком) ----
  const strokeStore = {};   // sectionKey -> [strokes]
  let strokes = strokeStore[sectionKey()] || (strokeStore[sectionKey()] = []);

  function docSize(){
    return {
      w: document.documentElement.clientWidth,
      h: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)
    };
  }

  function drawStrokeFull(s){
    if(!s.points || !s.points.length) return;
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    if(s.points.length === 1){
      ctx.beginPath();
      ctx.arc(s.points[0].x, s.points[0].y, (s.points[0].w || currentWidth) / 2, 0, Math.PI*2);
      ctx.fill();
      return;
    }
    for(let i=1;i<s.points.length;i++){
      ctx.beginPath();
      ctx.moveTo(s.points[i-1].x, s.points[i-1].y);
      ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.lineWidth = s.points[i].w || currentWidth;
      ctx.stroke();
    }
  }

  function redrawAll(){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    strokes.forEach(drawStrokeFull);
  }

  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const {w, h} = docSize();
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    redrawAll();
  }
  window.resizeDrawCanvas = resizeCanvas;
  resizeCanvas();
  // ВАЖЛИВО: якщо resize спрацює ПОКИ триває мазок пера (на iOS таке
  // трапляється, коли під час скролу ховається/зʼявляється панель адреси),
  // не чіпаємо полотно — інакше щойно намальований, але ще не збережений у
  // "strokes" шматок лінії просто зникає. Дочекаємось підняття пера.
  window.addEventListener('resize', ()=>{ if(!isDrawing) resizeCanvas(); });
  window.addEventListener('orientationchange', ()=> setTimeout(()=>{ if(!isDrawing) resizeCanvas(); }, 200));
  window.addEventListener('load', resizeCanvas);

  window.clearDrawing = function(){
    strokes.length = 0;
    redrawAll();
  };

  // сумісний з рештою сторінки API: збереження/відновлення чорнила поточної
  // вкладки при переключенні між вкладками (викликається з зовнішнього
  // скрипту через saveCurrentDrawing()/restoreCurrentDrawing())
  window.getDrawingSnapshot = function(){
    return JSON.stringify(strokes);
  };
  window.setDrawingSnapshot = function(json){
    let arr = [];
    if(json){ try{ arr = JSON.parse(json) || []; }catch(e){ arr = []; } }
    strokeStore[sectionKey()] = arr;
    strokes = arr;
    redrawAll();
  };

  function setActive(on){
    drawingActive = on;
    canvas.classList.toggle('active', on);
    toolbar.classList.toggle('show', on);
    toolbar.classList.remove('mini');
    toolbarMini.classList.remove('show');
    toggleBtn.classList.toggle('on', on);
    toggleBtn.title = on ? 'Вимкнути малювання' : 'Малювати';
    // поки малюємо — блокуємо однопальцеве смикання і подвійний тап (щоб
    // випадковий дотик долонею не гортав сторінку), але двома пальцями
    // масштабувати можна й далі — це окремий жест, який пер}у не заважає
    document.documentElement.style.touchAction = on ? 'pinch-zoom' : 'auto';
    document.body.style.touchAction = on ? 'pinch-zoom' : 'auto';
    document.documentElement.style.webkitUserSelect = on ? 'none' : '';
    document.body.style.webkitUserSelect = on ? 'none' : '';
    document.documentElement.style.userSelect = on ? 'none' : '';
    document.body.style.userSelect = on ? 'none' : '';
    document.body.style.webkitTouchCallout = on ? 'none' : '';
    if(on) resizeCanvas();
  }
  toggleBtn.addEventListener('click', ()=> setActive(!drawingActive));

  minimizeBtn.addEventListener('click', ()=>{
    toolbar.classList.remove('show');
    toolbar.classList.add('mini');
    toolbarMini.classList.add('show');
  });
  toolbarMini.addEventListener('click', ()=>{
    toolbar.classList.remove('mini');
    toolbar.classList.add('show');
    toolbarMini.classList.remove('show');
  });

  swatches.forEach(sw=>{
    sw.addEventListener('click', ()=>{
      swatches.forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      currentColor = sw.dataset.color;
      eraserMode = false;
      eraserBtn.classList.remove('selected');
    });
  });

  function selectWidth(btn, width){
    [xthinBtn, thinBtn, thickBtn].forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    currentWidth = width;
  }
  xthinBtn.addEventListener('click', ()=> selectWidth(xthinBtn, 2));
  thinBtn.addEventListener('click', ()=> selectWidth(thinBtn, 5));
  thickBtn.addEventListener('click', ()=> selectWidth(thickBtn, 11));

  eraserBtn.addEventListener('click', ()=>{
    eraserMode = !eraserMode;
    eraserBtn.classList.toggle('selected', eraserMode);
  });
  clearBtn.addEventListener('click', ()=> window.clearDrawing());

  function isPen(e){ return e.pointerType === 'pen'; }

  function dot(x, y, w){
    ctx.fillStyle = currentColor;
    ctx.beginPath();
    ctx.arc(x, y, (w || currentWidth) / 2, 0, Math.PI*2);
    ctx.fill();
  }

  function drawSegment(x, y){
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentWidth;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    if(currentStroke) currentStroke.points.push({x, y, w: currentWidth});
    lastX = x; lastY = y;
    strokeMoved = true;
  }

  // ---- ластик "цілим словом" ----
  function strokeHit(s, x, y){
    for(const p of s.points){
      if(Math.hypot(p.x - x, p.y - y) <= ERASE_RADIUS) return true;
    }
    return false;
  }
  let eraseChanged = false;
  let eraseRafScheduled = false;
  function eraseAt(x, y){
    if(!strokes.length) return;
    for(let i=strokes.length-1; i>=0; i--){
      if(strokeHit(strokes[i], x, y)){
        strokes.splice(i,1);
        eraseChanged = true;
      }
    }
    if(eraseChanged && !eraseRafScheduled){
      eraseRafScheduled = true;
      requestAnimationFrame(()=>{
        eraseRafScheduled = false;
        if(eraseChanged){ eraseChanged = false; redrawAll(); }
      });
    }
  }

  window.addEventListener('pointerdown', (e)=>{
    if(!drawingActive || !isPen(e)) return;
    e.preventDefault();
    isDrawing = true;
    strokeMoved = false;
    lastX = e.pageX; lastY = e.pageY;
    if(eraserMode){
      currentStroke = null;
      eraseAt(lastX, lastY);
    } else {
      currentStroke = { color: currentColor, points: [{x:lastX, y:lastY, w: currentWidth}] };
    }
  }, {passive:false});

  window.addEventListener('pointermove', (e)=>{
    if(!drawingActive || !isDrawing || !isPen(e)) return;
    e.preventDefault();
    const events = (typeof e.getCoalescedEvents === 'function' && e.getCoalescedEvents().length)
      ? e.getCoalescedEvents()
      : [e];
    for(const ev of events){
      const x = ev.pageX, y = ev.pageY;
      if(eraserMode){
        eraseAt(x, y);
        lastX = x; lastY = y;
      } else {
        if(x === lastX && y === lastY) continue;
        drawSegment(x, y);
      }
    }
  }, {passive:false});

  function stopDrawing(e){
    if(!isPen(e)) return;
    if(!eraserMode && currentStroke){
      if(!strokeMoved) dot(currentStroke.points[0].x, currentStroke.points[0].y, currentStroke.points[0].w);
      strokes.push(currentStroke);
    }
    currentStroke = null;
    isDrawing = false;
  }
  window.addEventListener('pointerup', stopDrawing);
  window.addEventListener('pointercancel', stopDrawing);
})();
</script>
</body>

</html>
