<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спрощення приголосних · Урок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAEEEA;
    --bg-soft:#F3F5F1;
    --card:#FFFFFF;
    --ink:#132435;
    --ink-soft:#66727C;
    --line: rgba(19,36,53,0.08);

    --c1-a:#3E86AC; --c1-b:#0B3B5C; --c1-sh: rgba(11,59,92,0.45);
    --c3-a:#6FD6BC; --c3-b:#1FA88A; --c3-sh: rgba(31,168,138,0.4);
    --c2-b:#E5484D;
    --c4-a:#C9B6EA; --c4-b:#8B5FBF;

    --correct-bg:#E4F7F1;
    --correct-ink:#0F8A6D;
    --wrong-bg:#FDECEC;
    --wrong-ink:#D8393E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 64px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:16px;margin-bottom:22px;
    border-bottom:1.5px solid rgba(19,36,53,0.14);
  }
  .kicker{
    font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.55;
  }
  .kicker.tag{opacity:.4;}

  h1{
    font-family:'Manrope',sans-serif;font-weight:800;
    font-size:clamp(24px,5.6vw,36px);line-height:1.08;letter-spacing:-0.01em;
    margin:0 0 8px;text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}
  .sub{color:var(--ink-soft);font-size:15px;max-width:56ch;margin:0 0 22px;font-weight:500;}

  /* tabs */
  .tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .tabbar.nested{margin-bottom:20px;}
  .tab{
    padding:10px 15px 10px 10px;border-radius:999px;border:none;background:var(--card);
    color:var(--ink-soft);font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;
    cursor:pointer;display:flex;align-items:center;gap:8px;
    box-shadow: 0 8px 18px -14px rgba(19,36,53,0.3);
  }
  .tabbar.nested .tab{background:var(--bg-soft);box-shadow:none;}
  .tab .dot{
    width:22px;height:22px;border-radius:8px;background:rgba(11,59,92,.1);color:var(--c1-b);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  }
  .tab.active{
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;
    box-shadow:0 10px 20px -10px var(--c1-sh);
  }
  .tab.active .dot{background:rgba(255,255,255,.25);color:#fff;}

  .tabbar.nested .tab.active{background:#fff;color:var(--c1-b);box-shadow:0 6px 16px -10px rgba(19,36,53,.3);}
  .tabbar.nested .tab.active .dot{background:var(--c1-b);color:#fff;}

  .card{
    background:var(--card);border-radius:28px;padding:28px 24px;
    box-shadow: 0 20px 44px -28px rgba(19,36,53,0.35);
  }

  .section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.005em;margin:0 0 8px;}
  .section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px;}
  .section-intro b{color:var(--ink);}

  .callout{
    background:linear-gradient(155deg, rgba(201,182,234,.30), rgba(139,95,191,.12));
    border-radius:18px;padding:14px 18px;margin-bottom:20px;font-size:13.5px;line-height:1.55;color:var(--ink);
  }
  .callout b{color:var(--c4-b);font-family:'Manrope',sans-serif;}

  .mnemo{margin-top:16px;font-size:13px;line-height:1.55;color:var(--ink-soft);}
  .mnemo b{color:var(--ink);}

  /* flip cards */
  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.cardgrid{grid-template-columns:1fr;}}
  .flip{perspective:1200px;height:158px;cursor:pointer;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .flip.open .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;border-radius:20px;padding:16px 18px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;}
  .flip-front{background:var(--bg-soft);}
  .flip-back{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;transform:rotateY(180deg);align-items:center;text-align:center;}
  .flip-tag{font-family:'Manrope',sans-serif;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin-bottom:7px;}
  .flip-back .flip-tag{opacity:.75;}
  .flip-rule{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;line-height:1.32;}
  .flip-desc{font-size:12.5px;margin-top:7px;opacity:.8;line-height:1.4;}
  .flip-example{font-size:14.5px;font-weight:700;margin-bottom:3px;}
  .flip-example:last-child{margin-bottom:0;}
  .flip-note{font-size:11px;opacity:.7;font-weight:500;}
  .flip-hint{position:absolute;bottom:9px;right:14px;font-size:10px;font-weight:700;opacity:.4;}

  /* exceptions chips */
  .chiprow{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{background:var(--bg-soft);border-radius:16px;padding:13px 18px;cursor:pointer;min-width:150px;transition:background .2s;}
  .chip .w{font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;}
  .chip .ipa{font-size:12px;color:#fff;font-weight:700;margin-top:5px;display:none;}
  .chip.open{background:linear-gradient(155deg, var(--c2-b), #C9302F);}
  .chip.open .w{color:#fff;}
  .chip.open .ipa{display:block;}

  /* combo table */
  .combo-table{display:flex;flex-direction:column;gap:8px;}
  .combo-row{display:flex;align-items:center;gap:12px;background:var(--bg-soft);border-radius:16px;padding:12px 16px;cursor:pointer;flex-wrap:wrap;}
  .combo-write{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;color:var(--c1-b);min-width:120px;}
  .combo-say{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--ink-soft);min-width:110px;}
  .combo-example{flex:1;font-size:14px;font-weight:600;min-width:150px;}
  .combo-ipa{font-size:13px;font-weight:700;color:var(--c3-b);opacity:0;transition:opacity .2s;}
  .combo-row.open .combo-ipa{opacity:1;}

  footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}

  /* ===================== DRAWING / TEACHER MODE ===================== */
  #drawCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:9998;
    touch-action:none;
    pointer-events:none;
  }

  #drawToggleBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;height:58px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.5);
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,var(--c1-a),var(--c1-b));
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    box-shadow:
      0 14px 28px -10px var(--c1-sh),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:9999;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease;
  }
  #drawToggleBtn svg{
    width:24px;height:24px;
    display:block;
    transition:transform .25s ease, opacity .15s ease;
  }
  #drawToggleBtn:active{transform:scale(0.90);}
  #drawToggleBtn.on{
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,#FF8A65,var(--c2-b));
    box-shadow:
      0 14px 28px -10px rgba(229,72,77,0.55),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
  }
  #drawToggleBtn.on svg{ transform:rotate(90deg); }

  #zoomToggleBtn{
    position:fixed;
    left:20px;
    bottom:20px;
    width:58px;height:58px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.5);
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,var(--c1-a),var(--c1-b));
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    box-shadow:
      0 14px 28px -10px var(--c1-sh),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:9999;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  #zoomToggleBtn:active{transform:scale(0.90);}

  #drawToolbar{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(130%) scale(0.94);
    opacity:0;
    display:flex;
    align-items:center;
    gap:12px;
    background:
      linear-gradient(150deg, rgba(255,255,255,0.6), rgba(255,255,255,0.15));
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.7);
    padding:9px 16px;
    border-radius:999px;
    box-shadow:
      0 24px 48px -20px rgba(19,36,53,0.45),
      inset 0 1px 1px rgba(255,255,255,0.9);
    z-index:9999;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    pointer-events:none;
  }
  #drawToolbar.show{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
  }
  .swatch{
    position:relative;
    width:25px;height:25px;
    border-radius:50%;
    border:none;
    box-shadow:
      0 3px 8px -2px rgba(19,36,53,0.35),
      inset 0 1px 1px rgba(255,255,255,0.5);
    cursor:pointer;
    padding:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch::after{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:2px solid var(--ink);
    opacity:0;
    transform:scale(0.7);
    transition:opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch.selected{ transform:scale(1.08); }
  .swatch.selected::after{ opacity:1; transform:scale(1); }
  .tool-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.5);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .tool-btn svg{ width:16px; height:16px; }
  .tool-btn .dot{
    border-radius:50%;
    background:currentColor;
  }
  #thinBtn .dot{ width:6px; height:6px; }
  #thickBtn .dot{ width:12px; height:12px; }
  .tool-btn.selected{
    background:var(--c1-b);
    color:#fff;
    transform:scale(1.06);
  }
  .tool-sep{
    width:1px;
    height:22px;
    background:rgba(19,36,53,0.14);
  }

  @media (max-width:480px){
    #drawToolbar{
      max-width:94vw;
      overflow-x:auto;
      padding:8px 13px;
      gap:9px;
    }
    .swatch{width:21px;height:21px;}
    .tool-btn{width:30px;height:30px;}
    .tool-btn svg{width:14px;height:14px;}
    .combo-write{min-width:96px;}
    .combo-say{min-width:96px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="kicker">Орфографія · Урок</div>
    <div class="kicker tag">Урок</div>
  </div>

  <h1>Спрощення <span class="hl">приголосних</span></h1>
  <p class="sub">У яких групах приголосних один звук випадає на письмі — і в яких словах спрощення заборонене, попри спрощену вимову.</p>

  <div class="tabbar" id="subtabbar"></div>
  <div class="tabbar nested" id="subsubtabbar"></div>

  <div class="card" id="lessonArea"></div>

  <footer>@movoznavka</footer>
</div>

<!-- ==== Малювання поверх екрана (для вчителя) ==== -->
<canvas id="drawCanvas"></canvas>
<button id="zoomToggleBtn" title="Збільшити текст">100%</button>
<button id="drawToggleBtn" title="Малювати">
  <svg id="drawIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#E5484D" data-color="#E5484D"></button>
  <button class="swatch" style="background:#0B3B5C" data-color="#0B3B5C"></button>
  <button class="swatch" style="background:#1FA88A" data-color="#1FA88A"></button>
  <button class="swatch" style="background:#132435" data-color="#132435"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="tool-btn" id="clearBtn" title="Очистити все">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<script>
/* ============================================================
   ЯК ДОДАТИ ЧИ ЗМІНИТИ МАТЕРІАЛ
   Весь контент живе в масиві SUBS нижче — це вкладки уроку.
   Кожна вкладка — один об'єкт { ... } з типом (type):
     "cards"      — картки, що перевертаються (rule/desc спереду, examples ззаду)
     "table"      — рядки-акордеони (write/say/example, ipa — розкривається)
     "exceptions" — чипи-слова (word/ipa — розкривається по кліку)
   Щоб додати картку/рядок/слово — скопіюй існуючий елемент
   всередині потрібного масиву (cards / rows / words) і
   зміни текст. Щоб додати цілу нову вкладку — скопіюй один об'єкт
   зі списку SUBS цілком і зміни tab / title / вміст.
   ============================================================ */

const SUBS = [
  {
    id: "groups", tab: "Групи звуків", dot: "1", type: "cards",
    title: "У яких групах приголосних відбувається спрощення",
    intro: "Коли до кореня, що закінчується на два приголосних, додається суфікс, який починається з приголосного, один зі звуків випадає. Тисни на картку, щоб побачити приклад.",
    cards: [
      {rule: "стн → сн", desc: "", examples: [{word:"чесний", ipa:"честь + -н- → чесний"}]},
      {rule: "стл → сл", desc: "", examples: [{word:"щасливий", ipa:"щастя + -л- → щасливий"}]},
      {rule: "ждн → жн", desc: "", examples: [{word:"тижневий", ipa:"тиждень + -н- → тижневий"}]},
      {rule: "здн → зн", desc: "", examples: [{word:"проїзний", ipa:"проїзд + -н- → проїзний"}]},
      {rule: "скн → сн", desc: "", examples: [{word:"блиснути", ipa:"блиск + -ну- → блиснути"}]},
      {rule: "зкн → зн", desc: "", examples: [{word:"брязнути", ipa:"брязк + -ну- → брязнути"}]},
      {rule: "слн → сн", desc: "", examples: [{word:"масний", ipa:"масло + -н- → масний"}]},
      {rule: "рнц → нц", desc: "", examples: [{word:"ченці", ipa:"чернець + -ц- → ченці"}]}
    ],
    mnemo: "<b>Важливо:</b> у власне усному мовленні спрощення відбувається завжди, але на письмі позначається лише в цих групах. В усіх інших випадках літеру, що випадає у вимові, на письмі зберігають — дивись вкладку «Без спрощення»."
  },
  {
    id: "stc", tab: "Стц, стч, стк", dot: "2", type: "table",
    title: "Групи, де спрощення не позначається на письмі",
    intro: "У групах приголосних <b>-стц-, -стч-</b>, що виникають при відмінюванні та творенні слів від основ на <b>-стк-</b>, літеру т на письмі зберігають, хоч вимова й спрощена.",
    rows: [
      {write:"невістка", say:"[невіс’ка]", example:"невістці, невістчин", ipa:"т зберігається на письмі"},
      {write:"артистка", say:"[артис’ка]", example:"артистці, артистчин", ipa:"т зберігається на письмі"}
    ],
    mnemo: "<b>Порівняй з вкладкою «Групи звуків»:</b> там т випадає й на письмі (чесний), а тут — лише у вимові (невістці)."
  },
  {
    id: "exceptions", tab: "Без спрощення", dot: "3", type: "exceptions",
    title: "Слова, у яких спрощення НЕ відбувається",
    intro: "Ці слова у мовленні звучать спрощено, але на письмі всі приголосні зберігають повністю. Тисни на слово, щоб побачити часту помилку.",
    words: [
      {word:"кістлявий", ipa:"НЕ кіслявий"},
      {word:"пестливий", ipa:"НЕ песливий"},
      {word:"хвастливий", ipa:"НЕ хвасливий"},
      {word:"хвастнути", ipa:"НЕ хваснути"},
      {word:"зап'ястний", ipa:"НЕ зап'ясний"},
      {word:"шістнадцять", ipa:"НЕ шіснадцять"},
      {word:"шістдесят", ipa:"НЕ шісдесят"},
      {word:"шістсот", ipa:"НЕ шіссот"},
      {word:"контрастний", ipa:"НЕ контрасний"},
      {word:"баластний", ipa:"НЕ баласний"},
      {word:"форпостний", ipa:"НЕ форпосний"},
      {word:"компостний", ipa:"НЕ компосний"},
      {word:"протестний", ipa:"НЕ протесний"},
      {word:"агентство", ipa:"НЕ агенство"},
      {word:"студентство", ipa:"НЕ студенство"},
      {word:"хворостняк", ipa:"НЕ хворосняк"},
      {word:"контекстний", ipa:"НЕ контексний"},
      {word:"аванпостний", ipa:"НЕ аванпосний"},
      {word:"випускний", ipa:"НЕ випусний"},
      {word:"рискнути", ipa:"НЕ риснути"},
      {word:"тоскно", ipa:"НЕ тосно"},
      {word:"скніти", ipa:"НЕ сніти"},
      {word:"скнара", ipa:"НЕ снара"}
    ]
  }
];

const activeSubsub = 0;
let activeSub = 0;

const subtabbar = document.getElementById('subtabbar');
const subsubtabbar = document.getElementById('subsubtabbar');
const lessonArea = document.getElementById('lessonArea');

function currentSub(){ return SUBS[activeSub]; }
function currentSection(){
  const sub = currentSub();
  if(sub.type === "nested") return sub.subsubs[activeSubsub];
  return sub;
}

function renderSubs(){
  subtabbar.innerHTML = SUBS.map((s,i)=>`
    <button class="tab ${i===activeSub?'active':''}" data-i="${i}">
      <span class="dot">${s.dot}</span>${s.tab}
    </button>`).join('');
  subtabbar.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick = ()=>{
      activeSub = +btn.dataset.i;
      if(window.clearDrawing) window.clearDrawing();
      renderAll();
    };
  });
}

function renderSubSubs(){
  subsubtabbar.innerHTML = "";
  subsubtabbar.style.display = "none";
}

function renderContent(){
  const s = currentSection();
  let html = `<p class="section-title">${s.title}</p><p class="section-intro">${s.intro}</p>`;
  if(s.type === "cards"){
    html += `<div class="cardgrid">${s.cards.map((c)=>`
      <div class="flip" data-kind="card">        <div class="flip-inner">
          <div class="flip-face flip-front">
            <div class="flip-rule">${c.rule}</div>
            <div class="flip-desc">${c.desc||''}</div>
            <div class="flip-hint">натисни →</div>
          </div>
          <div class="flip-face flip-back">
            ${c.examples.map(e=>`<div class="flip-example">${e.word}${e.ipa?' '+e.ipa:''}</div>${e.note?`<div class="flip-note">${e.note}</div>`:''}`).join('')}
          </div>
        </div>
      </div>`).join('')}</div>`;
    if(s.mnemo) html += `<div class="mnemo">${s.mnemo}</div>`;
  }

  if(s.type === "exceptions"){
    html += `<div class="chiprow">${s.words.map((w)=>`
      <div class="chip" data-kind="chip">
        <div class="w">${w.word}</div>
        <div class="ipa">${w.ipa}</div>
      </div>`).join('')}</div>`;
  }

  if(s.type === "table"){
    html += `<div class="combo-table">${s.rows.map((r)=>`
      <div class="combo-row" data-kind="row">
        <span class="combo-write">${r.write}</span>
        <span class="combo-say">${r.say}</span>
        <span class="combo-example">${r.example}</span>
        <span class="combo-ipa">${r.ipa}</span>
      </div>`).join('')}</div>`;
    if(s.mnemo) html += `<div class="mnemo">${s.mnemo}</div>`;
  }

  lessonArea.innerHTML = html;
  lessonArea.querySelectorAll('[data-kind="card"], [data-kind="chip"], [data-kind="row"]').forEach(el=>{
    el.onclick = ()=>{ el.classList.toggle('open'); };
  });
}

function renderAll(){
  renderSubs();
  renderSubSubs();
  renderContent();
}

renderAll();

// ======================================================================
// МАЛЮВАННЯ ПОВЕРХ ЕКРАНА (режим "учитель")
// Малює ЛИШЕ Apple Pencil (pointerType === 'pen'). Палець і миша завжди
// проходять крізь canvas без змін — можна гортати, перевертати картки й
// робити pinch-zoom навіть коли режим малювання ввімкнено.
// ======================================================================
(function(){
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('drawToggleBtn');
  const toolbar = document.getElementById('drawToolbar');
  const thinBtn = document.getElementById('thinBtn');
  const thickBtn = document.getElementById('thickBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const swatches = document.querySelectorAll('.swatch');

  let drawingActive = false;
  let isDrawing = false;
  let currentColor = "#E5484D";
  let currentWidth = 4;
  let eraserMode = false;
  let lastX = 0, lastY = 0;

  function resizeCanvas(){
    const prev = document.createElement('canvas');
    prev.width = canvas.width;
    prev.height = canvas.height;
    prev.getContext('2d').drawImage(canvas, 0, 0);

    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.drawImage(prev, 0, 0, prev.width / devicePixelRatio, prev.height / devicePixelRatio);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  window.clearDrawing = function(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  function setActive(on){
    drawingActive = on;
    canvas.classList.toggle('active', on);
    toolbar.classList.toggle('show', on);
    toggleBtn.classList.toggle('on', on);
    toggleBtn.title = on ? 'Вимкнути малювання' : 'Малювати';
  }

  toggleBtn.addEventListener('click', ()=> setActive(!drawingActive));

  swatches.forEach(sw=>{
    sw.addEventListener('click', ()=>{
      swatches.forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      currentColor = sw.dataset.color;
      eraserMode = false;
      eraserBtn.classList.remove('selected');
    });
  });

  thinBtn.addEventListener('click', ()=>{
    currentWidth = 4;
    thinBtn.classList.add('selected');
    thickBtn.classList.remove('selected');
  });
  thickBtn.addEventListener('click', ()=>{
    currentWidth = 12;
    thickBtn.classList.add('selected');
    thinBtn.classList.remove('selected');
  });
  eraserBtn.addEventListener('click', ()=>{
    eraserMode = !eraserMode;
    eraserBtn.classList.toggle('selected', eraserMode);
  });
  clearBtn.addEventListener('click', ()=>{
    window.clearDrawing();
  });

  function pointerPos(e){
    return { x: e.clientX, y: e.clientY, pressure: e.pressure || 0.5 };
  }

  function isPen(e){ return e.pointerType === 'pen'; }

  window.addEventListener('pointerdown', (e)=>{
    if(!drawingActive || !isPen(e)) return;
    isDrawing = true;
    const p = pointerPos(e);
    lastX = p.x; lastY = p.y;
    e.preventDefault();
  }, {passive:false});

  window.addEventListener('pointermove', (e)=>{
    if(!drawingActive || !isDrawing || !isPen(e)) return;
    e.preventDefault();
    const p = pointerPos(e);
    ctx.globalCompositeOperation = eraserMode ? 'destination-out' : 'source-over';
    ctx.strokeStyle = currentColor;
    const pressureFactor = 0.6 + (p.pressure || 0.5) * 0.8;
    ctx.lineWidth = (eraserMode ? currentWidth * 3 : currentWidth) * pressureFactor;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }, {passive:false});

  function stopDrawing(e){
    if(e && !isPen(e)) return;
    isDrawing = false;
  }
  window.addEventListener('pointerup', stopDrawing);
  window.addEventListener('pointercancel', stopDrawing);
})();

// ======================================================================
// ЗБІЛЬШЕННЯ ЕКРАНА (для показу класу на проєкторі/телевізорі)
// ======================================================================
(function(){
  const zoomBtn = document.getElementById('zoomToggleBtn');
  const zoomTarget = document.querySelector('.wrap');
  const levels = [1, 1.25, 1.5];
  let zi = 0;
  zoomBtn.addEventListener('click', ()=>{
    zi = (zi + 1) % levels.length;
    zoomTarget.style.zoom = levels[zi];
    zoomBtn.textContent = Math.round(levels[zi]*100) + '%';
  });
})();
</script>
</body>
